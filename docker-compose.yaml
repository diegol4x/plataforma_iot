services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: appuser
      POSTGRES_DB: iot_monitoring
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d iot_monitoring"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
    ports:
      - "1883:1883"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://appuser:appuser@postgres:5432/iot_monitoring
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://appuser:appuser@postgres:5432/iot_monitoring
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  subscriber:
    build: .
    command: ["python", "-m", "plataforma_iot.ingestion.subscriber"]
    environment:
      DATABASE_URL: postgresql+psycopg://appuser:appuser@postgres:5432/iot_monitoring
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: unless-stopped

  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    volumes:
      - ./infra/chirpstack:/etc/chirpstack
    environment:
      MQTT_BROKER_HOST: mosquitto
      REDIS_HOST: redis
      POSTGRESQL_HOST: chirpstack-postgres
    ports:
      - "8080:8080"
    depends_on:
      - chirpstack-postgres
      - redis
      - mosquitto
    restart: unless-stopped

  chirpstack-postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: chirpstack
      POSTGRES_DB: chirpstack
    volumes:
      - ./infra/chirpstack-postgres/initdb:/docker-entrypoint-initdb.d
      - chirpstackpgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  mosquittodata:
  chirpstackpgdata:
  redisdata: