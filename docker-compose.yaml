services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mosquitto:
    build:
      context: ./infra/mosquitto
    env_file:
      - .env
    volumes:
      - ./infra/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquittodata:/mosquitto/data
    ports:
      - "1883:1883"
    restart: unless-stopped

  migrate:
    build: .
    image: plataforma-iot:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    image: plataforma-iot:latest
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  subscriber:
    build: .
    image: plataforma-iot:latest
    command: ["python", "-m", "plataforma_iot.ingestion.subscriber"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: unless-stopped

  sweeper:
    build: .
    image: plataforma-iot:latest
    command: ["python", "-m", "plataforma_iot.tasks.runner"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SILENT_AFTER_SECONDS: "3600"
      SWEEP_INTERVAL_SECONDS: "300"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  gui:
    build: .
    image: plataforma-iot:latest
    command: ["python", "-m", "gui.app"]
    environment:
      API_URL: http://api:8000
    env_file:
      - .env
    ports:
      - "80:8080"
    depends_on:
      - api
    restart: unless-stopped

  ntp:
    image: cturra/ntp
    ports:
      - "123:123/udp"
    restart: unless-stopped

volumes:
  pgdata:
  mosquittodata: