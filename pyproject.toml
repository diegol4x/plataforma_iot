[project]
name = "plataforma-iot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "diego", email = "diegodiegola33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
plataforma-iot = "plataforma_iot.main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
