listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
persistence true
persistence_location /mosquitto/data/

# Pont a la ChirpStack de la passarel·la
connection chirpstack-gateway
address 192.168.0.1:1883
topic application/# in 0
remote_clientid plataforma-iot-bridge
cleansession false
start_type automatic
restart_timeout 10
notifications false